name: build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # GlassineOS/ui (the voices and the drawing) and GlassineOS/handwriting (the pen
      # interface's client library) are cloned at main by test/ui.sh and test/hw.sh.
      # make check: the store and view tests and the offscreen renders (out/renders),
      # kept as an artifact, never committed.
      - name: make check on Alpine
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.24 sh -euc '
            apk add -q build-base pkgconf linux-headers git curl cairo-dev pango-dev librsvg-dev glib-dev \
              font-dejavu font-eb-garamond wayland-dev wayland-protocols libxkbcommon-dev fontconfig python3
            make check HW_DIR=$(sh test/hw.sh)'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renders
          path: out/renders/
          if-no-files-found: ignore
