name: build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # GlassineOS/ui (the voices and the drawing) is cloned by test/ui.sh at GLASSINE_UI_REF (main).
      # make check: the layout and core tests, the offscreen renders (out/renders) and the
      # headless smoke run under sway (out/shots); both kept as artifacts, never committed.
      - name: make check on Alpine
        run: |
          docker run --rm -e GLASSINE_UI_REF -v "$PWD":/src -w /src alpine:3.24 sh -euc '
            apk add -q build-base pkgconf linux-headers git curl cairo-dev pango-dev librsvg-dev glib-dev \
              python3 py3-gobject3 py3-cairo gtk+3.0 font-dejavu font-eb-garamond adwaita-icon-theme \
              wayland-dev wayland-protocols libxkbcommon-dev sway grim wtype wlr-protocols fontconfig
            make check'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renders
          path: out/renders/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: |
            out/shots/
            out/smoke/*.log
          if-no-files-found: ignore
